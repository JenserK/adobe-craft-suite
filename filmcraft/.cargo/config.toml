# The browser build uses wasm SIMD (every current Chrome, Android WebView and Safari 16.4+ has it):
# the CPU compositor, resampling and encoders vectorise; an export ran about 18% faster.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]

[alias]
xtask = "run --quiet --package xtask --"
